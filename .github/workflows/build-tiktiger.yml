name: Build Tiktiger Dynamic Library

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tiktiger-dylib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tiktiger.dylib (Release)
    runs-on: macos-latest
    env:
      PROJECT: Tiktiger.xcodeproj
      SCHEME: Tiktiger
      CONFIGURATION: Release
      DERIVED_DATA: ${{ github.workspace }}/DerivedData
      EXPECTED_INSTALL_NAME: '@rpath/Tiktiger.dylib'
      REPORT: ${{ github.workspace }}/TIKTIGER_GITHUB_BUILD_REPORT.md
      XCODE_LIST_LOG: ${{ github.workspace }}/xcodebuild-list.log
      VALIDATION_LOG: ${{ github.workspace }}/validation.log
      BUILD_LOG: ${{ github.workspace }}/build.log
      HOST_PROJECT: HostTest/HostTest.xcodeproj
      HOST_SCHEME: TiktigerHostTest
      HOST_RUNTIME_DERIVED_DATA: ${{ github.workspace }}/HostTest/RuntimeDerivedData
      HOST_DERIVED_DATA: ${{ github.workspace }}/HostTest/DerivedData
      HOST_TEST_REPORT: ${{ github.workspace }}/HostTest/host-test-report.md
      HOST_TEST_LOG: ${{ github.workspace }}/HostTest/host-test.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${XCODE_VERSION:-}" ]]; then
            XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app"
            if [[ ! -d "$XCODE_PATH" ]]; then
              echo "VALIDATION_FAILED"
              echo "path=$XCODE_PATH"
              echo "expected=installed Xcode application for XCODE_VERSION=$XCODE_VERSION"
              echo "detected=missing"
              exit 1
            fi
          elif [[ -d "/Applications/Xcode.app" ]]; then
            XCODE_PATH="/Applications/Xcode.app"
          else
            XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | LC_ALL=C sort | tail -n 1)"
            if [[ -z "$XCODE_PATH" ]]; then
              echo "VALIDATION_FAILED"
              echo "path=/Applications"
              echo "expected=at least one Xcode*.app installation"
              echo "detected=none"
              exit 1
            fi
          fi
          if [[ ! -d "$XCODE_PATH/Contents/Developer" ]]; then
            echo "VALIDATION_FAILED"
            echo "path=$XCODE_PATH/Contents/Developer"
            echo "expected=Xcode Developer directory"
            echo "detected=missing"
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          echo "Selected Xcode: $XCODE_PATH"
          echo "Developer directory: $(xcode-select -p)"
          xcodebuild -version

      - name: Initialize CI report
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Tiktiger GitHub Build Report'
            echo
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Runner: $RUNNER_OS"
            echo "- Project: $PROJECT"
            echo "- Scheme: $SCHEME"
            echo "- Configuration: $CONFIGURATION"
            echo "- SDK: iphoneos"
            echo "- Architecture: arm64"
            echo "- Code signing: Disabled for source-only Dynamic Library build"
            echo
            echo '## Xcode'
            echo
            xcodebuild -version
            echo
          } > "$REPORT"

      - name: Run xcodebuild -list before build
        shell: bash
        run: |
          set -euo pipefail
          if ! xcodebuild -list -project "$PROJECT" > "$XCODE_LIST_LOG" 2>&1; then
            echo 'VALIDATION_FAILED'
            echo "path=$PROJECT"
            echo 'expected=xcodebuild -list succeeds and Xcode can parse the project'
            echo 'detected=xcodebuild -list failed'
            cat "$XCODE_LIST_LOG"
            exit 1
          fi
          {
            echo '## Xcode project discovery'
            echo
            echo '```text'
            cat "$XCODE_LIST_LOG"
            echo '```'
            echo
          } >> "$REPORT"
          cat "$XCODE_LIST_LOG"

      - name: Validate project structure with Xcode-parsed data
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/validate_tiktiger_project.py 2>&1 | tee "$VALIDATION_LOG" | tee -a "$REPORT"

      - name: Build Release Dynamic Library
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$DERIVED_DATA"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath "$DERIVED_DATA" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build 2>&1 | tee "$BUILD_LOG"

      - name: Locate Tiktiger.dylib
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          DYNAMIC_LIBRARY_LIST="$(find "$DERIVED_DATA/Build/Products" -type f -name 'Tiktiger.dylib' ! -path '*.dSYM/*' -print | sort)"
          DYNAMIC_LIBRARY_COUNT="$(printf '%s\n' "$DYNAMIC_LIBRARY_LIST" | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')"
          if [[ "$DYNAMIC_LIBRARY_COUNT" != '1' ]]; then
            echo 'VALIDATION_FAILED'
            echo "path=$DERIVED_DATA/Build/Products"
            echo 'expected=exactly one Tiktiger.dylib product'
            echo "detected=count=$DYNAMIC_LIBRARY_COUNT paths=$DYNAMIC_LIBRARY_LIST"
            exit 1
          fi
          DYNAMIC_LIBRARY="$(printf '%s\n' "$DYNAMIC_LIBRARY_LIST" | sed '/^[[:space:]]*$/d' | head -n 1)"
          if [[ ! -f "$DYNAMIC_LIBRARY" ]]; then
            echo 'VALIDATION_FAILED'
            echo "path=$DYNAMIC_LIBRARY"
            echo 'expected=regular file'
            echo 'detected=missing'
            exit 1
          fi
          echo "path=$DYNAMIC_LIBRARY" >> "$GITHUB_OUTPUT"
          echo "Tiktiger.dylib located at: $DYNAMIC_LIBRARY"

      - name: Validate Mach-O output
        shell: bash
        env:
          DYNAMIC_LIBRARY: ${{ steps.locate.outputs.path }}
        run: |
          set -euo pipefail
          FILE_OUTPUT="$(file "$DYNAMIC_LIBRARY")"
          OTOOL_L_OUTPUT="$(otool -L "$DYNAMIC_LIBRARY")"
          OTOOL_D_OUTPUT="$(otool -D "$DYNAMIC_LIBRARY")"
          NM_OUTPUT="$(nm -gU "$DYNAMIC_LIBRARY")"
          {
            echo '## Build result'
            echo
            echo 'Release build completed successfully on the macOS runner.'
            echo
            echo "- Artifact path: $DYNAMIC_LIBRARY"
            echo
            echo '## Mach-O validation output'
            echo
            echo '### file'
            echo '```text'
            echo "$FILE_OUTPUT"
            echo '```'
            echo
            echo '### otool -L'
            echo '```text'
            echo "$OTOOL_L_OUTPUT"
            echo '```'
            echo
            echo '### otool -D'
            echo '```text'
            echo "$OTOOL_D_OUTPUT"
            echo '```'
            echo
            echo '### nm -gU'
            echo '```text'
            echo "$NM_OUTPUT"
            echo '```'
          } >> "$REPORT"

          if ! printf '%s\n' "$FILE_OUTPUT" | grep -Eq 'Mach-O.*(dynamically linked shared library|dynamic library).*arm64'; then
            echo 'VALIDATION_FAILED'
            echo "path=$DYNAMIC_LIBRARY"
            echo 'expected=Mach-O dynamically linked shared library with arm64 architecture'
            echo "detected=$FILE_OUTPUT"
            exit 1
          fi

          INSTALL_NAME="$(printf '%s\n' "$OTOOL_D_OUTPUT" | tail -n 1 | tr -d '\r' | sed 's/^[[:space:]]*//')"
          if [[ "$INSTALL_NAME" != "$EXPECTED_INSTALL_NAME" ]]; then
            echo 'VALIDATION_FAILED'
            echo "path=$DYNAMIC_LIBRARY"
            echo "expected=$EXPECTED_INSTALL_NAME"
            echo "detected=$INSTALL_NAME"
            exit 1
          fi

          for symbol in \
            _TiktigerInitialize \
            _TiktigerGetVersion \
            _TiktigerGetStatus \
            _TiktigerShutdown; do
            if ! printf '%s\n' "$NM_OUTPUT" | awk '{print $NF}' | grep -Fxq "$symbol"; then
              echo 'VALIDATION_FAILED'
              echo "path=$DYNAMIC_LIBRARY"
              echo "expected=exported symbol $symbol"
              echo "detected=$(printf '%s\n' "$NM_OUTPUT" | awk '{print $NF}' | sort -u | tr '\n' ' ')"
              exit 1
            fi
          done

          FORBIDDEN_OUTPUT="$(find "$DERIVED_DATA/Build/Products" -type f \( -name '*.ipa' -o -name '*.framework' \) -print | sort)"
          if [[ -n "$FORBIDDEN_OUTPUT" ]]; then
            echo 'VALIDATION_FAILED'
            echo "path=$DERIVED_DATA/Build/Products"
            echo 'expected=no IPA or framework artifacts'
            echo "detected=$FORBIDDEN_OUTPUT"
            exit 1
          fi
          echo 'Mach-O architecture, install name, exports, and artifact hygiene validated.'

      - name: Upload Tiktiger.dylib artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Tiktiger-dylib-release
          path: |
            ${{ steps.locate.outputs.path }}
            TIKTIGER_GITHUB_BUILD_REPORT.md
          if-no-files-found: error
          retention-days: 14

      - name: Validate Host Test Environment
        shell: bash
        run: |
          set -euo pipefail
          for required in \
            HostTest/HostTest.xcodeproj/project.pbxproj \
            HostTest/HostTest.xcodeproj/xcshareddata/xcschemes/TiktigerHostTest.xcscheme \
            HostTest/TiktigerHostTestRunner.m \
            HostTest/TiktigerHostTestAppDelegate.m \
            HostTest/main.m \
            HostTest/Tests/TiktigerHostTestTests.m \
            HostTest/Info.plist \
            HostTest/Tests/Info.plist; do
            if [[ ! -f "$required" ]]; then
              echo 'VALIDATION_FAILED'
              echo "path=$required"
              echo 'expected=HostTest source/project file'
              echo 'detected=missing'
              exit 1
            fi
          done
          if find HostTest -type f \
            \( -name '*.ipa' -o -name '*.dylib' -o -name '*.framework' -o -name '*.xcarchive' \) \
            -print -quit | grep -q .; then
            echo 'VALIDATION_FAILED'
            echo 'path=HostTest'
            echo 'expected=no committed host binary or IPA artifacts before CI copy step'
            echo 'detected=forbidden artifact found'
            exit 1
          fi
          grep -q 'TiktigerHostTest' HostTest/HostTest.xcodeproj/xcshareddata/xcschemes/TiktigerHostTest.xcscheme
          grep -q 'TiktigerHostTestRunner.m' HostTest/HostTest.xcodeproj/project.pbxproj
          grep -q 'testRuntimeLifecycle' HostTest/Tests/TiktigerHostTestTests.m
          echo 'HOST_TEST_PREFLIGHT_PASS'

      - name: Build Host Test Runtime for Simulator
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOST_RUNTIME_DERIVED_DATA"
          xcodebuild \
            -project "$HOST_PROJECT" \
            -target TiktigerHostTest \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath "$HOST_RUNTIME_DERIVED_DATA" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
          SIMULATOR_DYLIB="$HOST_RUNTIME_DERIVED_DATA/Build/Products/Debug-iphonesimulator/Tiktiger.dylib"
          if [[ ! -f "$SIMULATOR_DYLIB" ]]; then
            echo 'VALIDATION_FAILED'
            echo "path=$SIMULATOR_DYLIB"
            echo 'expected=simulator-compatible Tiktiger.dylib'
            echo 'detected=missing'
            exit 1
          fi
          cp "$SIMULATOR_DYLIB" HostTest/Tiktiger.dylib
          file HostTest/Tiktiger.dylib

      - name: Run xcodebuild -list for Host Test
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -project "$HOST_PROJECT"

      - name: Run Host Test Integration
        shell: bash
        run: |
          set -euo pipefail
          HOST_APP="$HOST_DERIVED_DATA/Build/Products/Debug-iphonesimulator/TiktigerHostTest.app"
          HOST_EXECUTABLE="$HOST_APP/TiktigerHostTest"
          if [[ ! -x "$HOST_EXECUTABLE" ]]; then
            echo 'VALIDATION_FAILED'
            echo "path=$HOST_EXECUTABLE"
            echo 'expected=executable controlled HostTest app'
            echo 'detected=missing or not executable'
            exit 1
          fi
          DEVICE_UDID="$(python3 - <<'PY'
          import json
          import subprocess
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime_devices in devices.get("devices", {}).values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("state") == "Shutdown" and device.get("name"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available shutdown iOS Simulator was found")
          PY
          )"
          echo "Host test simulator: $DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID" || true
          xcrun simctl bootstatus "$DEVICE_UDID" -b
          xcrun simctl install "$DEVICE_UDID" "$HOST_APP"
          set +e
          xcrun simctl launch --console "$DEVICE_UDID" com.tiktiger.hosttest 2>&1 | tee "$HOST_TEST_LOG"
          LAUNCH_STATUS=${PIPESTATUS[0]}
          set -e
          sleep 2
          xcrun simctl terminate "$DEVICE_UDID" com.tiktiger.hosttest >/dev/null 2>&1 || true
          if [[ "$LAUNCH_STATUS" != '0' ]]; then
            echo 'VALIDATION_FAILED'
            echo "path=$HOST_TEST_LOG"
            echo 'expected=HostTest app launch exits successfully'
            echo "detected=simctl launch exit=$LAUNCH_STATUS"
            exit 1
          fi
          if ! grep -q 'TIKTIGER_HOST_TEST_RESULT passed=YES' "$HOST_TEST_LOG"; then
            echo 'VALIDATION_FAILED'
            echo "path=$HOST_TEST_LOG"
            echo 'expected=TIKTIGER_HOST_TEST_RESULT passed=YES'
            echo 'detected=pass marker missing or host test failed'
            tail -n 120 "$HOST_TEST_LOG"
            exit 1
          fi
          echo 'HOST_TEST_RUNTIME_PASS'

      - name: Write Host Test Report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Tiktiger Host Test Integration Report'
            echo
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Host project: $HOST_PROJECT"
            echo "- Host scheme: $HOST_SCHEME"
            echo '- Host execution: self-running Simulator app with explicit pass marker'
            echo "- Verified release Dylib: ${{ steps.locate.outputs.path }}"
            echo '- Simulator runtime: built from the same Tiktiger source for iphonesimulator compatibility'
            echo
            if [[ -f "$HOST_TEST_LOG" ]]; then
              echo '## Host test log tail'
              echo
              echo '```text'
              tail -n 120 "$HOST_TEST_LOG"
              echo '```'
            else
              echo 'Host test log was not produced.'
            fi
          } > "$HOST_TEST_REPORT"

      - name: Upload Host Test Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Tiktiger-host-test-report
          path: |
            HostTest/host-test-report.md
            HostTest/host-test.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload CI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tiktiger-ci-failure-${{ github.run_id }}
          path: |
            xcodebuild-list.log
            validation.log
            build.log
            HostTest/host-test-report.md
            HostTest/host-test.log
            TIKTIGER_GITHUB_BUILD_REPORT.md
          if-no-files-found: ignore
          retention-days: 14
